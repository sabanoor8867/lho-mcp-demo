[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lho-mcp-demo"
version = "0.1.0"
description = "LLM assistant for livestock health data: an MCP server and agent on the Livestock Health Ontology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pyoxigraph>=0.5,<0.6",
    "ollama>=0.6",
]

[project.optional-dependencies]
dev = ["pandas>=2.2", "pytest>=8"]

[project.scripts]
lho-chat = "lho_demo.web:main"
lho-ask = "lho_demo.agent:main"
lho-server = "lho_demo.server:main"
lho-generate-data = "lho_demo.generate_data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
